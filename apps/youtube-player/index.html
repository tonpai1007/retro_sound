<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO CRT - YT AUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --phosphor: #FFB000;
            --phosphor-glow: rgba(255, 176, 0, 0.6);
            --screen-bg: #0a0500;
        }
        body {
            background-color: #050505;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .crt-monitor {
            background: #1a1a1a; border-radius: 30px; padding: 50px;
            box-shadow: 0 0 0 15px #111, 0 0 0 20px #2a2a2a, 0 0 80px rgba(0,0,0,0.8);
            position: relative; width: 900px; height: 600px; max-width: 95%;
        }
        .power-led {
            position: absolute; bottom: 20px; right: 40px; width: 10px; height: 10px;
            background: var(--phosphor); border-radius: 50%; box-shadow: 0 0 15px var(--phosphor);
        }
        .brand-label {
            position: absolute; bottom: 25px; left: 40px; color: #555; font-size: 18px; letter-spacing: 2px;
        }
        .crt-screen {
            width: 100%; height: 100%; background: var(--screen-bg); border-radius: 25px;
            border: 3px solid #050505; color: var(--phosphor); overflow: hidden; position: relative;
            padding: 25px; box-sizing: border-box; box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
        }
        .crt-screen::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%), linear-gradient(90deg, rgba(255,176,0,0.03), rgba(0,0,0,0.1), rgba(255,176,0,0.03));
            z-index: 5; background-size: 100% 3px, 4px 100%; pointer-events: none;
        }
        .crt-screen::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 6; pointer-events: none;
        }
        .ui-wrapper { display: flex; flex-direction: column; height: 100%; z-index: 4; }
        .header {
            font-size: 24px; border-bottom: 2px solid var(--phosphor); padding-bottom: 10px;
            margin-bottom: 15px; text-shadow: 0 0 8px var(--phosphor-glow);
            display: flex; justify-content: space-between;
        }
        .input-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; align-items: center; font-size: 20px; }
        input[type="text"], input[type="number"] {
            background: transparent; border: none; border-bottom: 1px solid var(--phosphor);
            color: var(--phosphor); font-family: 'VT323', monospace; font-size: 20px; outline: none;
            width: 120px; text-shadow: 0 0 5px var(--phosphor-glow);
        }
        input[type="text"].long { width: 200px; }
        input[type="number"] { width: 50px; }
        button {
            background: transparent; border: 1px solid var(--phosphor); color: var(--phosphor);
            padding: 2px 15px; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        button:hover { background: var(--phosphor); color: var(--screen-bg); box-shadow: 0 0 15px var(--phosphor-glow); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .content-wrapper { display: flex; gap: 20px; flex-grow: 1; }
        .visualizer-panel {
            width: 250px; display: flex; flex-direction: column;
            border-right: 1px dashed var(--phosphor); padding-right: 15px;
        }
        #spectrum {
            flex-grow: 1; display: flex; align-items: flex-end; justify-content: center;
            gap: 2px; font-size: 22px; line-height: 1; text-shadow: 0 0 10px var(--phosphor-glow); margin-bottom: 10px;
        }
        .spec-bar { width: 10px; text-align: center; }
        .cassette-box {
            border: 1px solid var(--phosphor); padding: 10px; text-align: center; font-size: 14px;
            box-shadow: inset 0 0 15px rgba(255,176,0,0.1);
        }
        #cassette { white-space: pre; line-height: 1.1; margin-bottom: 5px; }
        .lyrics-panel {
            flex-grow: 1; overflow-y: auto; font-size: 22px; line-height: 1.3;
            scrollbar-width: thin; scrollbar-color: var(--phosphor) transparent;
        }
        .lyrics-panel::-webkit-scrollbar { width: 6px; }
        .lyrics-panel::-webkit-scrollbar-thumb { background: var(--phosphor); }

        .cursor {
            display: inline-block; width: 12px; height: 22px; background: var(--phosphor);
            vertical-align: text-bottom; animation: blink 1s steps(2) infinite; box-shadow: 0 0 10px var(--phosphor-glow);
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .loading { color: #ffff00; text-shadow: 0 0 8px #ffff00; }
        
        /* HIDDEN YOUTUBE PLAYER */
        #yt-player-container {
            position: absolute;
            width: 1px; height: 1px; /* 1x1 pixel to hide it but keep it playing */
            left: -9999px; top: -9999px; /* Push it off screen */
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Hidden YouTube Audio Player -->
    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <div class="crt-monitor">
        <div class="crt-screen">
            <div class="ui-wrapper">
                <div class="header">
                    <span>▓▒░ LYRIC_O.S v3.0 [YT_AUDIO] ░▒▓</span>
                    <span id="status">READY</span>
                </div>
                
                <div class="input-row">
                    ARTIST: <input type="text" id="artist" value="a-ha">
                    TRACK: <input type="text" id="title" value="Take On Me">
                    <br>
                    YT_ID: <input type="text" id="ytId" class="long" value="djV11Xbc914" title="Paste the YouTube Video ID (e.g. dQw4w9WgXcQ)">
                    BPM: <input type="number" id="bpm" value="169" min="60" max="200">
                    <button id="start-btn" onclick="startSession()">EXECUTE</button>
                </div>

                <div class="content-wrapper">
                    <div class="visualizer-panel">
                        <div id="spectrum"></div>
                        <div class="cassette-box">
                            <div id="cassette">
  ┌───────────────┐
  │  (O)=====(O)  │
  │   ▓▓▓▓▓▓▓▓▓   │
  └───────────────┘
                            </div>
                            <div id="tape-label">NO TAPE LOADED</div>
                        </div>
                    </div>
                    <div class="lyrics-panel">
                        <div id="lyrics-text">> SYSTEM READY...<br>> AWAITING COMMAND</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="brand-label">SYNCMASTER 570B</div>
        <div class="power-led"></div>
    </div>

    <script>
        // --- YOUTUBE IFRAME API SETUP ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let ytPlayer = null;
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '1',
                width: '1',
                videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onReady': () => console.log("YT Player Ready"),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if(event.data == YT.PlayerState.PLAYING) {
                document.getElementById('status').innerText = "PLAYING";
            } else if(event.data == YT.PlayerState.ENDED) {
                document.getElementById('status').innerText = "ENDED";
                stopSession();
            }
        }

        // --- DOM ELEMENTS ---
        const lyricsText = document.getElementById('lyrics-text');
        const cassette = document.getElementById('cassette');
        const tapeLabel = document.getElementById('tape-label');
        const startBtn = document.getElementById('start-btn');
        const spectrum = document.getElementById('spectrum');
        const statusEl = document.getElementById('status');

        let beatTimer = null;
        let reelState = 0;
        const reels = ['O', '0', '@', '0'];
        const blocks = " ▁▂▃▄▅▆▇█";
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // --- SPECTRUM ANALYZER SETUP ---
        const numBars = 15;
        let specBars = [];
        for(let i=0; i<numBars*2; i++) {
            let bar = document.createElement('span');
            bar.className = 'spec-bar';
            bar.innerText = '▁';
            spectrum.appendChild(bar);
            specBars.push(bar);
        }

        // --- VISUAL SYNC (Timer based, since we can't read YT audio data directly via JS) ---
        let beatCounter = 0;
        function updateVisuals() {
            reelState = (reelState + 1) % reels.length;
            const r = reels[reelState];
            const tape = Math.random() > 0.5 ? '▓' : '▒';
            cassette.innerText = `
  ┌───────────────┐
  │  (${r})=====(${r})  │
  │   ${tape}${tape}${tape}${tape}${tape}${tape}${tape}${tape}${tape}   │
  └───────────────┘`;
            cassette.style.transform = 'scale(1.02)';
            setTimeout(() => { cassette.style.transform = 'scale(1.0)'; }, 80);

            for(let i=0; i<numBars; i++) {
                let h = Math.floor(Math.random() * 8);
                specBars[i].innerText = blocks[h];
                specBars[(numBars*2)-1-i].innerText = blocks[h];
            }
        }

        function startBeat(bpm) {
            stopBeat();
            beatCounter = 0;
            const msPerBeat = 60000 / bpm;
            beatTimer = setInterval(() => {
                updateVisuals();
                beatCounter++;
            }, msPerBeat);
            return msPerBeat / 2;
        }

        function stopBeat() {
            if (beatTimer) clearInterval(beatTimer);
            beatTimer = null;
            cassette.style.transform = 'scale(1.0)';
            specBars.forEach(b => b.innerText = '▁');
        }

        // --- MAIN CONTROLLER ---
        async function startSession() {
            stopBeat();
            if(ytPlayer && ytPlayer.getPlayerState) {
                try { ytPlayer.pauseVideo(); } catch(e){}
            }

            const artist = document.getElementById('artist').value.trim();
            const title = document.getElementById('title').value.trim();
            const ytId = document.getElementById('ytId').value.trim();
            const bpm = parseInt(document.getElementById('bpm').value) || 120;
            
            if(!artist || !title || !ytId) {
                lyricsText.innerHTML = '<span style="color:#ff0000;">> ERROR: MISSING ARTIST, TITLE, OR YT_ID</span>';
                return;
            }

            startBtn.disabled = true;
            startBtn.innerText = "LOADING";
            statusEl.innerText = "FETCHING";
            lyricsText.innerHTML = '<span class="loading">> QUERYING LYRICS DB...</span>';
            tapeLabel.innerText = `${artist.toUpperCase()}`.substring(0, 15);

            try {
                // 1. Fetch Lyrics
                const response = await fetch(`https://api.lyrics.ovh/v1/${artist}/${title}`);
                const data = await response.json();
                
                if(data.error || !data.lyrics) {
                    lyricsText.innerHTML = '<span style="color:#ff0000; text-shadow:0 0 5px #ff0000;">> ERROR 404: LYRICS NOT FOUND</span>';
                    startBtn.disabled = false;
                    startBtn.innerText = "EXECUTE";
                    return;
                }

                // 2. Start YouTube Audio
                if(ytPlayer && ytPlayer.loadVideoById) {
                    ytPlayer.loadVideoById(ytId);
                    ytPlayer.playVideo();
                    statusEl.innerText = "BUFFERING";
                } else {
                    alert("YouTube Player is still loading. Wait a few seconds and try again.");
                }

                // 3. Start Visualizer & Lyrics
                const typeSpeed = startBeat(bpm);
                startBtn.innerText = "HALT";
                startBtn.disabled = false;
                startBtn.setAttribute('onclick', 'stopSession()');

                await typeLyrics(data.lyrics, typeSpeed);

            } catch (error) {
                lyricsText.innerHTML = '<span style="color:#ff0000;">> NETWORK ERROR</span>';
                startBtn.disabled = false;
                startBtn.innerText = "EXECUTE";
            }
        }

        function stopSession() {
            stopBeat();
            if(ytPlayer && ytPlayer.getPlayerState) {
                try { ytPlayer.pauseVideo(); } catch(e){}
            }
            startBtn.innerText = "EXECUTE";
            startBtn.setAttribute('onclick', 'startSession()');
            statusEl.innerText = "HALTED";
        }

        async function typeLyrics(text, typeSpeed) {
            lyricsText.innerHTML = '';
            const lines = text.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                let lineSpan = document.createElement('span');
                lyricsText.appendChild(lineSpan);
                
                const line = lines[i];
                for (let char of line) {
                    lineSpan.innerHTML += char;
                    lyricsText.parentElement.scrollTop = lyricsText.parentElement.scrollHeight;
                    await sleep(typeSpeed);
                }
                
                lyricsText.innerHTML += '\n';
                await sleep(typeSpeed * 1.5);
            }

            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            lyricsText.appendChild(cursor);
            stopSession();
        }
    </script>
</body>
</html>
