<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO CRT LYRICS</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* CRT Monitor Bezel */
        .crt-monitor {
            background: #0b0e0b;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 0 10px #2a2a2a, 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
            width: 800px;
            height: 500px;
            max-width: 90%;
        }

        /* Glowing Power LED */
        .power-led {
            position: absolute;
            bottom: 15px;
            right: 30px;
            width: 8px;
            height: 8px;
            background: #33ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #33ff00;
            animation: ledFlicker 3s infinite;
        }

        /* The actual CRT Screen */
        .crt-screen {
            width: 100%;
            height: 100%;
            background: #001100;
            border-radius: 15px;
            border: 2px solid #0a0a0a;
            color: #33ff00;
            overflow: hidden;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
        }

        /* CRT Curve & Vignette Effect */
        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
        .crt-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* UI Elements */
        .header {
            font-size: 24px;
            border-bottom: 2px solid #33ff00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #33ff00;
            z-index: 4;
        }

        .input-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; font-size: 20px; z-index: 4;}
        input[type="text"], input[type="number"] {
            background: #001100;
            border: none;
            border-bottom: 1px solid #33ff00;
            color: #33ff00;
            font-family: 'VT323', monospace;
            font-size: 20px;
            outline: none;
            width: 120px;
            text-shadow: 0 0 2px #33ff00;
        }
        input[type="number"] { width: 50px; }
        button {
            background: #001100;
            border: 1px solid #33ff00;
            color: #33ff00;
            padding: 2px 15px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #33ff00; color: #001100; }

        .content-wrapper { display: flex; gap: 20px; flex-grow: 1; z-index: 4; }
        
        /* Cassette Visualizer */
        .cassette-panel {
            width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px dashed #33ff00;
            padding-right: 10px;
        }
        #cassette {
            font-size: 16px;
            text-align: center;
            white-space: pre;
            line-height: 1.1;
            color: #33ff00;
            text-shadow: 0 0 5px #33ff00;
            transition: transform 0.05s;
        }
        .tape-label {
            margin-top: 10px;
            font-size: 18px;
            text-align: center;
        }

        .lyrics-panel {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 22px;
            line-height: 1.3;
            scrollbar-width: thin;
            scrollbar-color: #33ff00 #001100;
        }
        .lyrics-panel::-webkit-scrollbar { width: 6px; }
        .lyrics-panel::-webkit-scrollbar-thumb { background: #33ff00; }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 22px;
            background: #33ff00;
            vertical-align: text-bottom;
            animation: blink 1s steps(2) infinite;
            box-shadow: 0 0 5px #33ff00;
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        @keyframes ledFlicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes screenFlicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
        .crt-screen { animation: screenFlicker 0.1s infinite; }

        .loading { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
    </style>
</head>
<body>

    <div class="crt-monitor">
        <div class="crt-screen">
            <div class="header">▓▒░ LYRIC_O.S v1.4 ░▒▓</div>
            
            <div class="input-row">
                ARTIST: <input type="text" id="artist" value="a-ha">
                TRACK: <input type="text" id="title" value="Take On Me">
                BPM: <input type="number" id="bpm" value="169" min="60" max="200">
                <button id="start-btn" onclick="startSession()">RUN</button>
            </div>

            <div class="content-wrapper">
                <div class="cassette-panel">
                    <div id="cassette">
  ┌───────────────┐
  │  (O)=====(O)  │
  │   ▓▓▓▓▓▓▓▓▓   │
  │  ▣▣▣▣▣▣▣▣▣▣   │
  └───────────────┘
                    </div>
                    <div class="tape-label">SIDE A</div>
                </div>
                <div class="lyrics-panel">
                    <div id="lyrics-text">> AWAITING INPUT...</div>
                </div>
            </div>
        </div>
        <div class="power-led"></div>
    </div>

    <script>
        const lyricsText = document.getElementById('lyrics-text');
        const cassette = document.getElementById('cassette');
        const tapeLabel = document.querySelector('.tape-label');
        const startBtn = document.getElementById('start-btn');

        let beatTimer = null;
        let audioCtx = null;
        let reelState = 0;
        const reels = ['O', '0', '@', '0']; // Animation frames for tape reels
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // --- 8-BIT AUDIO ENGINE ---
        function playRetroBeat() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // 1. 8-Bit Kick Drum (Triangle Wave)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);

            // 2. 8-Bit Hi-Hat (White Noise burst)
            const bufferSize = audioCtx.sampleRate * 0.05;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1000;
            
            noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
            noise.stop(audioCtx.currentTime + 0.05);
        }

        // --- CASSETTE VISUAL SYNC ---
        function updateCassette() {
            reelState = (reelState + 1) % reels.length;
            const r = reels[reelState];
            
            // Jitter the tape string slightly on the beat
            const tape = Math.random() > 0.5 ? '▓' : '▒';
            
            cassette.innerText = `
  ┌───────────────┐
  │  (${r})=====(${r})  │
  │   ${tape}${tape}${tape}${tape}${tape}${tape}${tape}${tape}${tape}   │
  │  ▣▣▣▣▣▣▣▣▣▣   │
  └───────────────┘
            `;
            
            // Quick scale up on beat
            cassette.style.transform = 'scale(1.05)';
            setTimeout(() => { cassette.style.transform = 'scale(1.0)'; }, 80);
        }

        // --- BPM CONTROLLER ---
        function startBeat(bpm) {
            stopBeat();
            const msPerBeat = 60000 / bpm;
            beatTimer = setInterval(() => {
                updateCassette();
                playRetroBeat();
            }, msPerBeat);
            return msPerBeat / 2;
        }

        function stopBeat() {
            if (beatTimer) clearInterval(beatTimer);
            beatTimer = null;
            cassette.style.transform = 'scale(1.0)';
        }

        // --- LYRIC FETCHER ---
        async function startSession() {
            stopBeat();
            const artist = document.getElementById('artist').value.trim();
            const title = document.getElementById('title').value.trim();
            const bpm = parseInt(document.getElementById('bpm').value) || 120;
            if(!artist || !title) return;

            startBtn.disabled = true;
            startBtn.innerText = "LOADING";
            lyricsText.innerHTML = '<span class="loading">> DIALING DATABASE...</span>';
            tapeLabel.innerText = `${artist.toUpperCase()}`.substring(0, 15);

            try {
                const response = await fetch(`https://api.lyrics.ovh/v1/${artist}/${title}`);
                const data = await response.json();
                
                if(data.error || !data.lyrics) {
                    lyricsText.innerHTML = '<span style="color:#ff0000; text-shadow:0 0 5px #ff0000;">> ERROR 404: LYRICS NOT FOUND</span>';
                    startBtn.disabled = false;
                    startBtn.innerText = "RUN";
                    return;
                }

                const typeSpeed = startBeat(bpm);
                startBtn.innerText = "STOP";
                startBtn.disabled = false;
                startBtn.setAttribute('onclick', 'stopSession()');

                await typeLyrics(data.lyrics, typeSpeed);

            } catch (error) {
                lyricsText.innerHTML = '<span style="color:#ff0000;">> NETWORK ERROR</span>';
                startBtn.disabled = false;
                startBtn.innerText = "RUN";
            }
        }

        function stopSession() {
            stopBeat();
            startBtn.innerText = "RUN";
            startBtn.setAttribute('onclick', 'startSession()');
        }

        async function typeLyrics(text, typeSpeed) {
            lyricsText.innerHTML = '';
            const lines = text.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                let lineSpan = document.createElement('span');
                lyricsText.appendChild(lineSpan);
                
                const line = lines[i];
                for (let char of line) {
                    lineSpan.innerHTML += char;
                    lyricsText.parentElement.scrollTop = lyricsText.parentElement.scrollHeight;
                    await sleep(typeSpeed);
                }
                
                lyricsText.innerHTML += '\n';
                await sleep(typeSpeed * 1.5);
            }

            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            lyricsText.appendChild(cursor);
            stopSession();
        }
    </script>
</body>
</html>
