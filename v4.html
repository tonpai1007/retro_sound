<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PHANTOM SIGNAL</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --phosphor: #FFB000;
            --phosphor-glow: rgba(255, 176, 0, 0.7);
            --neon-green: #33ff00;
            --screen-bg: #0a0500;
        }
        body {
            background-color: #050505; font-family: 'VT323', monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .crt-monitor {
            background: #1a1a1a; border-radius: 30px; padding: 50px;
            box-shadow: 0 0 0 15px #111, 0 0 0 20px #2a2a2a, 0 0 80px rgba(0,0,0,0.8);
            position: relative; width: 950px; height: 650px; max-width: 95%;
        }
        .crt-screen {
            width: 100%; height: 100%; background: var(--screen-bg); border-radius: 25px;
            border: 3px solid #050505; color: var(--phosphor); overflow: hidden; position: relative;
            padding: 25px; box-sizing: border-box; box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
        }
        .crt-screen::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%), linear-gradient(90deg, rgba(255,176,0,0.03), rgba(0,0,0,0.1), rgba(255,176,0,0.03));
            z-index: 5; background-size: 100% 3px, 4px 100%; pointer-events: none;
        }
        .crt-screen::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 6; pointer-events: none;
        }
        .ui-wrapper { display: flex; flex-direction: column; height: 100%; z-index: 4; }
        .header {
            font-size: 24px; border-bottom: 2px solid var(--phosphor); padding-bottom: 10px;
            margin-bottom: 15px; text-shadow: 0 0 8px var(--phosphor-glow);
            display: flex; justify-content: space-between;
        }
        .main-content { display: flex; gap: 20px; flex-grow: 1; }
        
        /* Left Panel: Oscilloscope & Radio Dial */
        .left-panel {
            width: 40%; display: flex; flex-direction: column; gap: 15px;
            border-right: 1px dashed var(--phosphor); padding-right: 15px;
        }
        .scope-container {
            flex-grow: 1; border: 2px solid var(--phosphor); background: #000;
            box-shadow: inset 0 0 20px rgba(255,176,0,0.1); position: relative; overflow: hidden;
        }
        #oscilloscope { width: 100%; height: 100%; }
        .radio-dial {
            border: 2px solid var(--phosphor); padding: 10px; text-align: center;
        }
        .dial-display { font-size: 32px; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); margin-bottom: 10px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--phosphor); }
        
        /* Right Panel: Karaoke / Numbers Station */
        .right-panel { flex-grow: 1; display: flex; flex-direction: column; }
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; font-size: 20px; }
        input[type="text"] {
            background: transparent; border: none; border-bottom: 1px solid var(--phosphor);
            color: var(--phosphor); font-family: 'VT323', monospace; font-size: 20px; outline: none;
            width: 120px; text-shadow: 0 0 5px var(--phosphor-glow);
        }
        button {
            background: transparent; border: 1px solid var(--phosphor); color: var(--phosphor);
            padding: 2px 15px; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        button:hover { background: var(--phosphor); color: #000; box-shadow: 0 0 15px var(--phosphor-glow); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .lyrics-panel {
            flex-grow: 1; overflow-y: auto; font-size: 24px; line-height: 1.4;
            scrollbar-width: thin; scrollbar-color: var(--phosphor) transparent;
            padding: 10px; border: 1px solid #333;
        }
        .lyrics-panel::-webkit-scrollbar { width: 6px; }
        .lyrics-panel::-webkit-scrollbar-thumb { background: var(--phosphor); }
        
        /* Karaoke Sync Styles */
        .word { color: #555; transition: color 0.1s, text-shadow 0.1s; display: inline-block; }
        .word.active { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); transform: scale(1.1); }
        .word.sung { color: var(--phosphor); text-shadow: 0 0 5px var(--phosphor-glow); }
        
        .status-bar {
            margin-top: 10px; font-size: 18px; color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
        }
        .loading { color: #ffff00; text-shadow: 0 0 8px #ffff00; }
    </style>
</head>
<body>

    <div class="crt-monitor">
        <div class="crt-screen">
            <div class="ui-wrapper">
                <div class="header">
                    <span>▓▒░ PHANTOM_SIGNAL.v4 ░▒▓</span>
                    <span id="clock">00:00:00</span>
                </div>
                
                <div class="main-content">
                    <!-- Left: Oscilloscope & Radio -->
                    <div class="left-panel">
                        <div class="scope-container">
                            <canvas id="oscilloscope"></canvas>
                        </div>
                        <div class="radio-dial">
                            <div class="dial-display" id="dial-display">88.0 FM</div>
                            <input type="range" id="tuner" min="880" max="1080" value="880" oninput="tuneRadio()">
                            <div style="font-size: 14px; color: #888; margin-top: 5px;">TUNE DOWN FOR NUMBERS STATION</div>
                        </div>
                    </div>

                    <!-- Right: Karaoke / Terminal -->
                    <div class="right-panel">
                        <div class="input-row">
                            ARTIST: <input type="text" id="artist" value="a-ha">
                            TRACK: <input type="text" id="title" value="Take On Me">
                            <button id="broadcast-btn" onclick="startBroadcast()">BROADCAST</button>
                        </div>
                        <div class="lyrics-panel" id="lyrics-text">
                            > AWAITING SIGNAL...<br>> TUNE RADIO ABOVE 104.0 FOR MUSIC<br>> TUNE BELOW 92.0 FOR PHANTOM STATION
                        </div>
                        <div class="status-bar" id="status">STATUS: STANDBY</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DOM ELEMENTS ---
        const lyricsText = document.getElementById('lyrics-text');
        const dialDisplay = document.getElementById('dial-display');
        const tuner = document.getElementById('tuner');
        const statusEl = document.getElementById('status');
        const broadcastBtn = document.getElementById('broadcast-btn');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');

        // --- WEB AUDIO SETUP ---
        let audioCtx = null;
        let analyser = null;
        let audioSource = null;
        let noiseSource = null;
        let currentAudio = null;
        let syncTimer = null;
        let speechSynth = window.speechSynthesis;

        // 1. Initialize Audio Context (Must be done after user interaction)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.connect(audioCtx.destination);
            }
        }

        // 2. Oscilloscope Drawing Loop
        function drawOscilloscope() {
            requestAnimationFrame(drawOscilloscope);
            
            // Resize canvas to fit container
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            
            const bufferLength = analyser ? analyser.frequencyBinCount : 1024;
            const dataArray = new Uint8Array(bufferLength);
            if (analyser) analyser.getByteTimeDomainData(dataArray);

            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = '#FFB000';
            canvasCtx.shadowBlur = 10;
            canvasCtx.shadowColor = '#FFB000';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                let v;
                if (analyser && (currentAudio || noiseSource)) {
                    v = dataArray[i] / 128.0;
                } else {
                    // Idle flat line with slight sine wave
                    v = 1 + Math.sin(i * 0.05 + Date.now() * 0.005) * 0.02;
                }
                const y = (v * canvas.height) / 2;

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);

                x += sliceWidth;
            }
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }
        drawOscilloscope();

        // --- RADIO TUNING LOGIC ---
        function tuneRadio() {
            const freq = parseInt(tuner.value);
            const freqDecimal = (freq / 10).toFixed(1);
            dialDisplay.innerText = `${freqDecimal} FM`;

            initAudio();

            // Stop everything first
            stopNoise();
            stopCurrentAudio();
            if (speechSynth.speaking) speechSynth.cancel();

            if (freq < 920) {
                // NUMBERS STATION
                statusEl.innerText = "STATUS: PHANTOM STATION DETECTED";
                startNumbersStation();
            } else if (freq > 1040) {
                statusEl.innerText = "STATUS: MUSIC BAND. PRESS BROADCAST";
            } else {
                statusEl.innerText = "STATUS: DEAD AIR...";
            }
        }

        // --- NUMBERS STATION LOGIC ---
        function startNumbersStation() {
            // Create White Noise
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;
            
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.value = 0.1; // Static volume
            
            // Route noise to analyser so oscilloscope reacts
            noiseSource.connect(noiseGain);
            noiseGain.connect(analyser);
            noiseSource.start();

            // Creepy Robot Voice reading numbers
            function speakNumbers() {
                if (parseInt(tuner.value) >= 920) return; // Stop if user tuned away
                if (speechSynth.speaking) return;

                const utterance = new SpeechSynthesisUtterance();
                const numbers = [];
                for(let i=0; i<5; i++) numbers.push(Math.floor(Math.random() * 10));
                utterance.text = numbers.join("... ");
                utterance.pitch = 0.1;
                utterance.rate = 0.7;
                
                speechSynth.speak(utterance);
                utterance.onend = () => {
                    setTimeout(speakNumbers, 3000); // Pause then repeat
                };
            }
            speakNumbers();
        }

        function stopNoise() {
            if (noiseSource) {
                try { noiseSource.stop(); } catch(e){}
                noiseSource.disconnect();
                noiseSource = null;
            }
        }

        // --- KARAOKE & MUSIC LOGIC ---
        async function startBroadcast() {
            if (parseInt(tuner.value) <= 1040) {
                lyricsText.innerHTML = '<span style="color:#ff0000;">> TUNE RADIO ABOVE 104.0 FM FIRST!</span>';
                return;
            }

            initAudio();
            stopCurrentAudio();
            stopNoise();
            if (speechSynth.speaking) speechSynth.cancel();

            const artist = document.getElementById('artist').value.trim();
            const title = document.getElementById('title').value.trim();
            if(!artist || !title) return;

            broadcastBtn.disabled = true;
            statusEl.innerText = "STATUS: SCANNING FREQUENCIES...";
            lyricsText.innerHTML = '<span class="loading">> FETCHING LYRICS & PREVIEW...</span>';

            try {
                // 1. Fetch Lyrics
                const lyricRes = await fetch(`https://api.lyrics.ovh/v1/${artist}/${title}`);
                const lyricData = await lyricRes.json();
                
                if(lyricData.error || !lyricData.lyrics) {
                    lyricsText.innerHTML = '<span style="color:#ff0000;">> LYRICS NOT FOUND</span>';
                    broadcastBtn.disabled = false;
                    return;
                }

                // 2. Fetch 30s iTunes Preview
                const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist + ' ' + title)}&entity=song&limit=1`);
                const itunesData = await itunesRes.json();
                
                if(!itunesData.results || !itunesData.results[0].previewUrl) {
                    lyricsText.innerHTML = '<span style="color:#ff0000;">> AUDIO PREVIEW NOT FOUND</span>';
                    broadcastBtn.disabled = false;
                    return;
                }

                const previewUrl = itunesData.results[0].previewUrl;
                statusEl.innerText = "STATUS: SIGNAL LOCKED. SYNCING...";

                // 3. Setup HTML5 Audio element for the preview
                currentAudio = new Audio(previewUrl);
                currentAudio.crossOrigin = "anonymous";
                
                // Route audio through Web Audio API for Oscilloscope
                audioSource = audioCtx.createMediaElementSource(currentAudio);
                audioSource.connect(analyser);

                // 4. Setup Perfect Karaoke Sync
                setupKaraoke(lyricData.lyrics);

                currentAudio.play();
                broadcastBtn.innerText = "STOP";
                broadcastBtn.disabled = false;
                broadcastBtn.setAttribute('onclick', 'stopBroadcast()');

            } catch (err) {
                lyricsText.innerHTML = '<span style="color:#ff0000;">> NETWORK ERROR</span>';
                broadcastBtn.disabled = false;
            }
        }

        function stopBroadcast() {
            stopCurrentAudio();
            statusEl.innerText = "STATUS: BROADCAST HALTED";
            broadcastBtn.innerText = "BROADCAST";
            broadcastBtn.setAttribute('onclick', 'startBroadcast()');
            lyricsText.innerHTML = '> SIGNAL LOST...<br>> AWAITING NEW BROADCAST';
        }

        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                if (audioSource) audioSource.disconnect();
                currentAudio = null;
                audioSource = null;
            }
            if (syncTimer) {
                clearInterval(syncTimer);
                syncTimer = null;
            }
        }

        // --- THE PERFECT SYNC MATH ---
        function setupKaraoke(rawLyrics) {
            // Clean lyrics and split into words
            const cleanText = rawLyrics.replace(/\n/g, ' \n ').replace(/\r/g, '');
            const words = cleanText.split(' ').filter(w => w.length > 0);
            
            // Render words to screen
            lyricsText.innerHTML = '';
            const wordElements = [];
            words.forEach(word => {
                if (word === '\n') {
                    lyricsText.innerHTML += '<br>';
                } else {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.innerText = word + ' ';
                    lyricsText.appendChild(span);
                    wordElements.push(span);
                }
            });

            // Calculate timing (Preview is exactly 30 seconds = 30000ms)
            const totalDuration = 30000;
            const timePerWord = totalDuration / wordElements.length;
            let currentIndex = 0;

            // Start highlighting loop
            syncTimer = setInterval(() => {
                if (currentIndex >= wordElements.length) {
                    clearInterval(syncTimer);
                    return;
                }
                
                // Mark previous as sung
                if (currentIndex > 0) wordElements[currentIndex - 1].classList.remove('active');
                if (currentIndex > 0) wordElements[currentIndex - 1].classList.add('sung');
                
                // Highlight current word
                wordElements[currentIndex].classList.add('active');
                
                // Auto-scroll to bottom
                lyricsText.scrollTop = lyricsText.scrollHeight;
                
                currentIndex++;
            }, timePerWord);
        }

        // --- CLOCK ---
        function updateClock() {
            const d = new Date();
            document.getElementById('clock').innerText = d.toLocaleTimeString('en-US', {hour12: false});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Resize handler for canvas
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        });
    </script>
</body>
</html>
